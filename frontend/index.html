<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!--
      移动端适配要点：
      - width=device-width + initial-scale=1：避免桌面页被缩小塞进手机
      - viewport-fit=cover：刘海/挖孔/Home 条区域可铺满，再用 safe-area 内边距
      - interactive-widget=resizes-content：Android Chrome 弹出键盘时收缩布局（iOS 忽略）
      - 不禁用缩放（无 maximum-scale），兼顾无障碍
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1B7F5A" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1612" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="我的账本" />
    <title>我的账本</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('mbk_theme') || 'system'
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}

        // iOS 主屏 App 冷启动时视口会少算状态栏高度（切页后才恢复），底栏因此悬空；
        // 此模式下全屏铺满，直接用屏幕物理高度，底栏改按 top 定位（见 styles.css .ios-standalone）
        var iosStandalone = navigator.standalone === true
        if (iosStandalone) document.documentElement.classList.add('ios-standalone')

        // 稳定可视高度：规避 iOS/Android 地址栏显隐导致的 100vh 跳动
        function setAppHeight() {
          var h = window.visualViewport ? window.visualViewport.height : window.innerHeight
          if (iosStandalone) {
            var landscape = window.matchMedia('(orientation: landscape)').matches
            var sw = landscape ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height)
            // iPad 分屏时窗口小于屏幕，不能套用屏幕高度
            if (Math.abs(window.innerWidth - sw) <= 2) {
              h = landscape ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height)
            }
          }
          document.documentElement.style.setProperty('--app-height', h + 'px')
        }
        setAppHeight()
        window.addEventListener('resize', setAppHeight)
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', setAppHeight)
          window.visualViewport.addEventListener('scroll', setAppHeight)
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
